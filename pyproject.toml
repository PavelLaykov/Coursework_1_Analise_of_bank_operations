[tool.poetry]
name = "pythonproject3"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.33.1"
python-dotenv = "^1.2.3"
pandas = "^3.0.6"
openpyxl = "^3.1.5"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.20.1"
black = "^26.3.1"
isort = "^8.0.1"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(\.git
  )/
)'''

[tool.isort]
line_length = 119
force_grid_wrap = 0

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
